<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación de Ciencias Naturales - 6° Básico</title>
  <style>
    :root {
      --bg: #eef4ff;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --text: #0f172a;
      --muted: #475569;
      --line: #cbd5e1;
      --shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 100%);
      color: var(--text);
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--panel);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px 22px 30px;
    }

    header {
      text-align: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 2vw, 2.2rem);
      color: var(--text);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .student-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 26px;
    }

    .student-info label {
      font-weight: 700;
      color: #334155;
    }

    .student-info input {
      flex: 1;
      min-width: 220px;
      border: 1px solid #94a3b8;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .student-info input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .question-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 18px 12px;
      margin-bottom: 18px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .question-card:hover {
      border-color: #93c5fd;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.08);
      transform: translateY(-1px);
    }

    .topic-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.06rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 16px;
      color: var(--text);
    }

    .option-item {
      display: flex;
      align-items: center;
      background: var(--panel-alt);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }

    .option-item:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .option-item input[type="radio"] {
      margin-right: 12px;
      accent-color: var(--primary);
      transform: scale(1.2);
      cursor: pointer;
    }

    .option-item span {
      line-height: 1.4;
      color: #1f2937;
    }

    .btn-primary, .btn-secondary {
      width: 100%;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.04rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .btn-primary {
      margin-top: 18px;
      padding: 16px;
      background: linear-gradient(135deg, var(--success) 0%, #22c55e 100%);
      color: white;
      box-shadow: 0 12px 16px rgba(22, 163, 74, 0.2);
    }

    .btn-secondary {
      display: none;
      padding: 14px;
      margin-top: 14px;
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
      color: white;
      box-shadow: 0 8px 18px rgba(51, 65, 85, 0.18);
    }

    .btn-primary:hover, .btn-secondary:hover {
      transform: translateY(-1px);
    }

    #resultsSection {
      display: none;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 2px solid #e2e8f0;
    }

    .summary-card {
      background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
      border: 2px solid #7dd3fc;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin-bottom: 22px;
    }

    .summary-card h2 {
      margin: 0 0 10px;
      color: #0369a1;
    }

    .summary-card p {
      margin: 0;
      color: #0f172a;
    }

    .stats-grid {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .stat-box {
      background: white;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .stat-good { color: var(--success); }
    .stat-bad { color: var(--danger); }
    .stat-grade { color: #2563eb; }

    .review-item {
      padding: 16px 18px;
      border-radius: 12px;
      margin-bottom: 12px;
      line-height: 1.55;
      font-size: 0.97rem;
    }

    .review-correct {
      background: var(--success-soft);
      border-left: 6px solid var(--success);
      color: #14532d;
    }

    .review-incorrect {
      background: var(--danger-soft);
      border-left: 6px solid var(--danger);
      color: #7f1d1d;
    }

    #resultsSection h3 {
      margin: 0 0 14px;
      color: var(--text);
    }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .container { padding: 18px 14px 20px; }
      .student-info { padding: 12px 14px; }
      .option-item { padding: 11px 12px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Evaluación de Ciencias Naturales</h1>
    <p class="subtitle">Desarrollo Humano, Sistemas Reproductores y Gametos (Nivel 12 años)</p>
  </header>

  <div class="student-info">
    <label for="studentName">Nombre del estudiante:</label>
    <input type="text" id="studentName" placeholder="Escribe tu nombre y apellido aquí...">
  </div>

  <form id="examForm">
    <div id="questionsList"></div>
    <button type="button" class="btn-primary" id="btnFinish" onclick="terminarPrueba()">Terminar Prueba</button>
    <button type="button" class="btn-secondary" id="btnRetry" onclick="reiniciarPrueba()">Volver a realizar la prueba</button>
  </form>

  <div id="resultsSection">
    <div class="summary-card" id="summaryCard"></div>
    <h3>Revisión detallada de respuestas:</h3>
    <div id="reviewContainer"></div>
  </div>
</div>

<script>
  const bancoPreguntas = [
    {
      tema: "Etapas biológicas del desarrollo humano",
      pregunta: "1. ¿En qué etapa del desarrollo humano ocurren los cambios físicos que preparan al cuerpo para poder tener hijos?",
      alternativas: [
        "A) En la vejez",
        "B) En la pubertad y adolescencia",
        "C) En la primera infancia",
        "D) En la adultez mayor"
      ],
      correcta: 1
    },
    {
      tema: "Etapas biológicas del desarrollo humano",
      pregunta: "2. ¿Qué característica define principalmente a la etapa de la adultez?",
      alternativas: [
        "A) El cuerpo alcanza su madurez física completa y máxima capacidad para asumir responsabilidades.",
        "B) Comienzan a aparecer los primeros dientes de leche y se aprende a caminar.",
        "C) Se inicia por primera vez la producción de hormonas sexuales.",
        "D) Disminuye aceleradamente la estatura y la masa ósea."
      ],
      correcta: 0
    },
    {
      tema: "Etapas biológicas del desarrollo humano",
      pregunta: "3. ¿Cuál es la secuencia cronológica correcta de las etapas de la vida humana?",
      alternativas: [
        "A) Niñez → Adultez → Adolescencia → Vejez",
        "B) Adolescencia → Niñez → Vejez → Adultez",
        "C) Niñez → Pubertad y Adolescencia → Adultez → Vejez",
        "D) Pubertad → Niñez → Adultez → Vejez"
      ],
      correcta: 2
    },
    {
      tema: "Características sexuales primarias y secundarias",
      pregunta: "4. ¿Qué son las características sexuales primarias?",
      alternativas: [
        "A) Los cambios de voz y la aparición de acné en la adolescencia.",
        "B) Los órganos reproductores internos y externos con los que nacemos.",
        "C) El crecimiento de vello en las axilas y el pubis.",
        "D) El aumento de estatura repentino alrededor de los 12 años."
      ],
      correcta: 1
    },
    {
      tema: "Características sexuales primarias y secundarias",
      pregunta: "5. ¿Cuál de las siguientes opciones corresponde a una característica sexual secundaria femenina?",
      alternativas: [
        "A) Presencia de ovarios al nacer.",
        "B) Ensanchamiento de las caderas y desarrollo de las glándulas mamarias.",
        "C) Engrosamiento de las cuerdas vocales y voz más grave.",
        "D) Aparición de vello abundante en el rostro (barba y bigote)."
      ],
      correcta: 1
    },
    {
      tema: "Características sexuales primarias y secundarias",
      pregunta: "6. ¿Qué sustancias químicas del cuerpo provocan la aparición de las características sexuales secundarias?",
      alternativas: [
        "A) Las vitaminas y minerales de los alimentos.",
        "B) Los glóbulos rojos de la sangre.",
        "C) Las hormonas sexuales (estrógenos, progesterona y testosterona).",
        "D) Las enzimas digestivas del estómago."
      ],
      correcta: 2
    },
    {
      tema: "Aparato genital femenino",
      pregunta: "7. ¿Cuál es la función principal de los ovarios?",
      alternativas: [
        "A) Recibir al bebé durante todo el embarazo.",
        "B) Producir los ovocitos (óvulos) y las hormonas sexuales femeninas.",
        "C) Conectar el útero con el exterior del cuerpo.",
        "D) Almacenar la orina antes de ser expulsada."
      ],
      correcta: 1
    },
    {
      tema: "Aparato genital femenino",
      pregunta: "8. ¿En qué lugar del aparato reproductor femenino ocurre normalmente la fecundación (unión del ovocito y el espermatozoide)?",
      alternativas: [
        "A) En la vagina",
        "B) En el cuello uterino",
        "C) En las trompas de Falopio (oviductos)",
        "D) En la vejiga"
      ],
      correcta: 2
    },
    {
      tema: "Aparato genital femenino",
      pregunta: "9. ¿Cómo se llama el órgano muscular hueco donde se implanta y desarrolla el embrión durante el embarazo?",
      alternativas: [
        "A) Útero",
        "B) Ovario",
        "C) Uretra",
        "D) Vulva"
      ],
      correcta: 0
    },
    {
      tema: "Aparato genital masculino",
      pregunta: "10. ¿Qué órganos del aparato genital masculino producen los espermatozoides y la testosterona?",
      alternativas: [
        "A) Las vesículas seminales",
        "B) La próstata",
        "C) Los testículos",
        "D) Los conductos deferentes"
      ],
      correcta: 2
    },
    {
      tema: "Aparato genital masculino",
      pregunta: "11. ¿Cuál es la función de las vesículas seminales y la próstata?",
      alternativas: [
        "A) Producir líquidos que nutren y facilitan el transporte de los espermatozoides formando el semen.",
        "B) Fabricar los espermatozoides desde la infancia.",
        "C) Filtrar la sangre para formar la orina.",
        "D) Regular la temperatura corporal de todo el cuerpo."
      ],
      correcta: 0
    },
    {
      tema: "Aparato genital masculino",
      pregunta: "12. ¿Qué conducto recorre el interior del pene y permite la salida del semen y de la orina hacia el exterior?",
      alternativas: [
        "A) El epidídimo",
        "B) La uretra",
        "C) El oviducto",
        "D) El uréter"
      ],
      correcta: 1
    },
    {
      tema: "Gametos sexuales",
      pregunta: "13. ¿Cómo se llaman las células sexuales (gametos) masculina y femenina?",
      alternativas: [
        "A) Testículo y ovario",
        "B) Espermatozoide y ovocito",
        "C) Testosterona y estrógeno",
        "D) Neurona y glóbulo blanco"
      ],
      correcta: 1
    },
    {
      tema: "Gametos sexuales",
      pregunta: "14. ¿Qué diferencia física existe entre un ovocito y un espermatozoide?",
      alternativas: [
        "A) El ovocito tiene una cola larga para nadar y el espermatozoide es gigante y redondo.",
        "B) Ambos tienen exactamente el mismo tamaño y forma.",
        "C) El ovocito es grande, esférico y sin movimiento propio; el espermatozoide es pequeño y tiene flagelo (cola) para moverse.",
        "D) El espermatozoide contiene nutrientes para el embarazo y el ovocito no."
      ],
      correcta: 2
    },
    {
      tema: "Gametos sexuales",
      pregunta: "15. ¿Qué se forma cuando un espermatozoide logra fecundar a un ovocito?",
      alternativas: [
        "A) Una hormona",
        "B) Un cigoto (primera célula del nuevo ser vivo)",
        "C) Un ovario",
        "D) Una vesícula seminal"
      ],
      correcta: 1
    }
  ];

  function renderizarPreguntas() {
    const contenedor = document.getElementById("questionsList");
    contenedor.innerHTML = "";

    bancoPreguntas.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "question-card";

      let alternativasHTML = "";
      item.alternativas.forEach((alt, altIndex) => {
        alternativasHTML += `
          <label class="option-item">
            <input type="radio" name="q_${index}" value="${altIndex}">
            <span>${alt}</span>
          </label>
        `;
      });

      card.innerHTML = `
        <span class="topic-badge">${item.tema}</span>
        <div class="question-text">${item.pregunta}</div>
        ${alternativasHTML}
      `;

      contenedor.appendChild(card);
    });
  }

  function calcularNota(puntaje, total) {
    const exigencia = 0.60;
    const puntajeAprobacion = total * exigencia;
    let nota = 1.0;

    if (puntaje < puntajeAprobacion) {
      nota = 1.0 + 3.0 * (puntaje / puntajeAprobacion);
    } else {
      nota = 4.0 + 3.0 * ((puntaje - puntajeAprobacion) / (total - puntajeAprobacion));
    }

    return nota.toFixed(1);
  }

  function terminarPrueba() {
    const total = bancoPreguntas.length;

    for (let i = 0; i < total; i++) {
      const marcada = document.querySelector(`input[name="q_${i}"]:checked`);
      if (!marcada) {
        alert(`Te falta responder la pregunta ${i + 1}. Por favor, selecciona una alternativa antes de terminar.`);
        return;
      }
    }

    let buenas = 0;
    let malas = 0;
    let revisionHTML = "";

    bancoPreguntas.forEach((item, index) => {
      const marcada = document.querySelector(`input[name="q_${index}"]:checked`);
      const seleccion = parseInt(marcada.value, 10);
      const textoSeleccionado = item.alternativas[seleccion];
      const textoCorrecto = item.alternativas[item.correcta];

      if (seleccion === item.correcta) {
        buenas++;
        revisionHTML += `
          <div class="review-item review-correct">
            <strong>✅ Pregunta ${index + 1}: ¡Correcta!</strong><br>
            <em>${item.pregunta}</em><br>
            Tu respuesta: <strong>${textoSeleccionado}</strong><br>
            Respuesta correcta: <strong>${textoCorrecto}</strong>
          </div>
        `;
      } else {
        malas++;
        revisionHTML += `
          <div class="review-item review-incorrect">
            <strong>❌ Pregunta ${index + 1}: Incorrecta</strong><br>
            <em>${item.pregunta}</em><br>
            Tu respuesta: ${textoSeleccionado}<br>
            👉 Respuesta correcta: <strong>${textoCorrecto}</strong>
          </div>
        `;
      }
    });

    const nombre = document.getElementById("studentName").value.trim() || "Estudiante";
    const notaFinal = calcularNota(buenas, total);

    document.getElementById("summaryCard").innerHTML = `
      <h2>Resultados de ${nombre}</h2>
      <p>Has completado las ${total} preguntas de la evaluación.</p>
      <div class="stats-grid">
        <div class="stat-box stat-good">Buenas: ${buenas}</div>
        <div class="stat-box stat-bad">Malas: ${malas}</div>
        <div class="stat-box stat-grade">Nota final: ${notaFinal}</div>
      </div>
    `;

    document.getElementById("reviewContainer").innerHTML = revisionHTML;
    document.getElementById("resultsSection").style.display = "block";
    document.getElementById("btnFinish").style.display = "none";
    document.getElementById("btnRetry").style.display = "block";

    document.querySelectorAll('input[type="radio"]').forEach(radio => radio.disabled = true);
    document.getElementById("studentName").disabled = true;
    document.getElementById("resultsSection").scrollIntoView({ behavior: "smooth" });
  }

  function reiniciarPrueba() {
    document.getElementById("resultsSection").style.display = "none";
    document.getElementById("btnFinish").style.display = "block";
    document.getElementById("btnRetry").style.display = "none";
    document.getElementById("studentName").disabled = false;
    document.getElementById("studentName").value = "";
    renderizarPreguntas();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  renderizarPreguntas();
</script>

</body>
</html>
