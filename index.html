function renderizarPreguntas() {
const contenedor = document.getElementById("questionsList");
contenedor.innerHTML = "";
bancoPreguntas.forEach((item, index) => {
const card = document.createElement("div");
card.className = "question-card";
let alternativasHTML = "";
item.alternativas.forEach((alt, altIndex) => {
alternativasHTML += `
`;
});

contenedor.appendChild(card);
});
}
function calcularNota(puntaje, total) {
// Escala chilena: 1.0 a 7.0 con 60% de exigencia
const exigencia = 0.60;
const puntajeAprobacion = total * exigencia;
let nota = 1.0;
if (puntaje < puntajeAprobacion) {
nota = 1.0 + 3.0 * (puntaje / puntajeAprobacion);
} else {
nota = 4.0 + 3.0 * ((puntaje - puntajeAprobacion) / (total - puntajeAprobacion));
}
return nota.toFixed(1);
}
function terminarPrueba() {
const total = bancoPreguntas.length;
// Verificar que todas las preguntas estén respondidas
for (let i = 0; i < total; i++) {
const marcada = document.querySelector(input[name="q_${i}"]:checked);
if (!marcada) {
alert(Te falta responder la pregunta ${i + 1}. Por favor, selecciona una alternativa antes de terminar.);
return;
}
}
let buenas = 0;
let malas = 0;
let revisionHTML = "";
bancoPreguntas.forEach((item, index) => {
const marcada = document.querySelector(input[name="q_${index}"]:checked);
const seleccion = parseInt(marcada.value);
const textoSeleccionado = item.alternativas[seleccion];
const textoCorrecto = item.alternativas[item.correcta];
if (seleccion === item.correcta) {
buenas++;
revisionHTML += <div class="review-item review-correct"> <strong>✅ Pregunta ${index + 1}: ¡Correcta!</strong><br> <em>${item.pregunta}</em><br> Tu respuesta: <strong>${textoSeleccionado}</strong> </div>;
} else {
malas++;
revisionHTML += <div class="review-item review-incorrect"> <strong>❌ Pregunta ${index + 1}: Incorrecta</strong><br> <em>${item.pregunta}</em><br> Tu respuesta: ${textoSeleccionado}<br> 👉 <strong>Respuesta correcta: ${textoCorrecto}</strong> </div>;
}
});
const nombre = document.getElementById("studentName").value.trim() || "Estudiante";
const notaFinal = calcularNota(buenas, total);
document.getElementById("summaryCard").innerHTML = <h2>Resultados de ${nombre}</h2> <p>Has completado las ${total} preguntas de la evaluación.</p> <div class="stats-grid"> <div class="stat-box stat-good">✅ Buenas: ${buenas}</div> <div class="stat-box stat-bad">❌ Malas: ${malas}</div> <div class="stat-box stat-grade">📊 Nota: ${notaFinal}</div> </div>;
document.getElementById("reviewContainer").innerHTML = revisionHTML;
document.getElementById("resultsSection").style.display = "block";
document.getElementById("btnFinish").style.display = "none";
document.getElementById("btnRetry").style.display = "block";
// Bloquear opciones para que no se cambien después de terminar
document.querySelectorAll('input[type="radio"]').forEach(radio => radio.disabled = true);
document.getElementById("studentName").disabled = true;
document.getElementById("resultsSection").scrollIntoView({ behavior: "smooth" });
}
function reiniciarPrueba() {
document.getElementById("resultsSection").style.display = "none";
document.getElementById("btnFinish").style.display = "block";
document.getElementById("btnRetry").style.display = "none";
document.getElementById("studentName").disabled = false;
renderizarPreguntas();
window.scrollTo({ top: 0, behavior: "smooth" });
}
// Cargar preguntas al iniciar
